name: Site steward

# Weekly audit of the site. Fixes the safe issues, remembers what it found, and opens a pull request.
# Nothing goes live until you merge it. Needs Settings > Actions > General > "Allow GitHub Actions to create and approve pull requests".
on:
  schedule:
    - cron: "17 21 * * 0"      # Sunday 21:17 UTC, Monday morning in Korea
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  steward:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install beautifulsoup4 lxml pytest
      - name: Steward tests
        run: python -m pytest -q tools/steward
      - name: Audit and apply safe fixes
        run: python tools/steward/steward.py --fix
      - name: Open a pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$(git status --porcelain)" ]; then echo "No changes."; exit 0; fi
          branch="steward/$(date +%Y-%m-%d)"
          git config user.name "site-steward"
          git config user.email "steward@users.noreply.github.com"
          git checkout -b "$branch"
          git add -A
          git commit -m "Site steward: weekly audit and safe fixes"
          git push -u origin "$branch"
          gh pr create --base main --head "$branch" --title "Site steward: weekly audit $(date +%Y-%m-%d)" --body-file tools/steward/REPORT.md
